<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>USE MILETTA | Elegância no seu movimento</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;

      background-color: #e8e8e8;
      background-image: url("fundo-prata-miletta.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo img {
      width: 175px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .frase {
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 500;
      color: #111;
      margin-bottom: 28px;
    }

    .linha {
      width: 55px;
      height: 2px;
      background: #d88fb4;
      margin: 0 auto 35px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 18px 20px;

      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 12px;

      color: #111;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-decoration: none;
      text-align: center;

      box-shadow:
        0 4px 18px rgba(70, 70, 70, 0.12),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);

      transition: all 0.3s ease;
    }

    .botao:hover {
      background: #f8dce9;
      border-color: #d88fb4;
      transform: translateY(-3px);

      box-shadow:
        0 8px 25px rgba(216, 143, 180, 0.3);
    }

    .botao.drop {
      background: rgba(255, 229, 241, 0.9);
      border: 1px solid #d88fb4;
    }

    .botao.drop:hover {
      background: #f5c5dc;
    }

    .rodape {
      margin-top: 45px;
      font-size: 10px;
      letter-spacing: 3px;
      color: #333;
    }

    @media (max-width: 600px) {
      body {
        background-attachment: scroll;
        background-position: center;
        padding: 35px 20px;
      }

      .logo img {
        width: 155px;
      }

      .frase {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .botao {
        padding: 17px 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- LOGO ORIGINAL PRETA -->
    <div class="logo">
      <img
        src="logo-miletta-preta.png"
        alt="Logo Use Miletta"
      >
    </div>

    <!-- FRASE DA MARCA -->
    <p class="frase">
      Elegância no seu movimento.
    </p>

    <div class="linha"></div>

    <!-- BOTÕES -->
    <div class="links">

      <!-- DROP -->
      <a
        class="botao drop"
        href="https://www.instagram.com/s/aGlnaGxpZ2h0OjE3OTM5Nzk0Njc0MzgxNTA3?story_media_id=3982520431823185260_80222226622&amp;psln=aDU1YWg5a2d4b2Yw"
        target="_blank"
        rel="noopener noreferrer"
      >
        DROP
      </a>

      <!-- WHATSAPP -->
      <a
        class="botao"
        href="https://wa.me/5511952987005"
        target="_blank"
        rel="noopener noreferrer"
      >
        COMPRE PELO WHATSAPP
      </a>

      <!-- GRUPO VIP -->
      <a
        class="botao"
        href="https://chat.whatsapp.com/EyHEoT9FaC55qsOlwBJ65W?s=cl&amp;p=i&amp;mlu=4&amp;ilr=4&amp;iam=2"
        target="_blank"
        rel="noopener noreferrer"
      >
        GRUPO VIP
      </a>

      <!-- INSTAGRAM -->
      <a
        class="botao"
        href="https://www.instagram.com/usemiletta?obrf=MTNieW84NnZlY3hsZQ=="
        target="_blank"
        rel="noopener noreferrer"
      >
        INSTAGRAM
      </a>

      <!-- SITE OFICIAL -->
      <a
        class="botao"
        href="#"
        onclick="alert('Em breve!'); return false;"
      >
        SITE OFICIAL
      </a>

    </div>

    <!-- RODAPÉ -->
    <footer class="rodape">
      USE MILETTA © 2026
    </footer>

  </main>

</body>
</html>
